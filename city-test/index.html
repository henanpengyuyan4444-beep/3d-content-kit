<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>三个测试 · 选一个开始</title>
<style>
  :root{--bg:#08080c;--ink:#f5f2ec;--muted:rgba(245,242,236,.5);--line:rgba(245,242,236,.12);}
  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;padding:28px;}
  body::before{content:"";position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(60vw 60vw at 15% 5%,rgba(255,107,53,.14),transparent 60%),
               radial-gradient(55vw 55vw at 85% 90%,rgba(78,205,196,.12),transparent 60%);}
  .wrap{position:relative;width:100%;max-width:460px;}
  .kicker{font-size:11px;letter-spacing:.26em;color:#ff6b35;font-weight:700;margin-bottom:16px;}
  h1{font-family:"Songti SC","Noto Serif SC",serif;font-size:34px;line-height:1.2;margin:0 0 10px;font-weight:900;}
  .sub{font-size:13px;color:var(--muted);line-height:1.8;margin-bottom:28px;}
  a.card{display:block;text-decoration:none;color:inherit;background:rgba(255,255,255,.04);
    border:1px solid var(--line);border-radius:16px;padding:20px 18px;margin-bottom:12px;
    transition:border-color .2s,background .2s,transform .12s;}
  a.card:hover{border-color:rgba(255,107,53,.5);background:rgba(255,107,53,.06);}
  a.card:active{transform:scale(.99);}
  .card b{display:block;font-size:18px;font-family:"Songti SC",serif;margin-bottom:6px;}
  .card span{font-size:12px;color:var(--muted);}
  .foot{margin-top:22px;font-size:11px;color:rgba(245,242,236,.3);line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">THREE TESTS</div>
  <h1>选一个<br>开始测</h1>
  <p class="sub">都是 3–4 分钟的小测试，测完能保存结果图。</p>

  <a class="card" href="city-test-v2.html">
    <b>你命里该去哪座城</b>
    <span>20 题 · 9 座城市 · 测你适合定居在哪</span>
  </a>

  <a class="card" href="love-test-v2.html">
    <b>你在恋爱里是哪只动物</b>
    <span>18 题 · 8 种人格 · 测你一谈恋爱就变成什么样</span>
  </a>

  <a class="card" href="study-test-v2.html">
    <b>你该往哪个方向使劲</b>
    <span>18 题 · 9 个方向 · 测你的脑子天生对什么有反应</span>
  </a>

  <div class="foot">趣味自我探索工具，结果由固定算法生成，仅供娱乐参考。</div>
</div>
</body>
</html>
