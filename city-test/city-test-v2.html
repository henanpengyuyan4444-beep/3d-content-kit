<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>你命里该去哪座城</title>
<style>
  :root{
    --bg:#08080c;
    --ink:#f5f2ec;
    --muted:rgba(245,242,236,.55);
    --line:rgba(245,242,236,.12);
    --orange:#ff6b35;
    --cyan:#4ecdc4;
    --card:rgba(255,255,255,.04);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh;
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background:
      radial-gradient(60vw 60vw at 15% 5%, rgba(255,107,53,.16), transparent 60%),
      radial-gradient(55vw 55vw at 85% 90%, rgba(78,205,196,.13), transparent 60%),
      radial-gradient(40vw 40vw at 70% 20%, rgba(120,90,255,.10), transparent 60%);
    pointer-events:none;z-index:0;
  }
  #app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:0 22px 60px;}

  .screen{display:none;animation:fadeUp .5s ease both;}
  .screen.active{display:block;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  /* ---------- intro ---------- */
  .intro{padding-top:16vh;text-align:left;}
  .kicker{
    font-size:11px;letter-spacing:.28em;color:var(--orange);
    text-transform:uppercase;margin-bottom:22px;font-weight:700;
  }
  h1{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:clamp(38px,11vw,54px);
    line-height:1.08;font-weight:900;margin:0 0 22px;
    letter-spacing:-.02em;
  }
  h1 em{
    font-style:normal;
    background:linear-gradient(100deg,var(--orange),#ffd166 55%,var(--cyan));
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .lede{font-size:15px;line-height:1.85;color:var(--muted);margin:0 0 34px;}
  .lede b{color:var(--ink);font-weight:600;}
  .btn{
    display:block;width:100%;border:0;border-radius:16px;
    padding:18px;font-size:16px;font-weight:700;cursor:pointer;
    background:linear-gradient(100deg,var(--orange),#ff8f5e);
    color:#1a0d05;letter-spacing:.02em;
    transition:transform .15s ease, box-shadow .25s ease;
    box-shadow:0 10px 30px -8px rgba(255,107,53,.6);
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{
    background:transparent;color:var(--ink);
    border:1px solid var(--line);box-shadow:none;font-weight:600;
  }
  .meta{
    display:flex;gap:18px;margin-top:26px;
    font-size:12px;color:var(--muted);
  }
  .meta span{display:flex;align-items:center;gap:6px;}

  /* ---------- quiz ---------- */
  .topbar{display:flex;align-items:center;gap:14px;padding:22px 0 0;}
  .back{
    background:none;border:0;color:var(--muted);font-size:20px;
    cursor:pointer;padding:4px 8px 4px 0;line-height:1;
  }
  .bar{flex:1;height:3px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),var(--cyan));border-radius:3px;transition:width .35s ease;}
  .count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:46px;text-align:right;}

  .qwrap{padding-top:9vh;}
  .qnum{font-size:11px;letter-spacing:.3em;color:var(--muted);margin-bottom:18px;font-weight:700;}
  .q{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:clamp(23px,6.2vw,29px);line-height:1.45;font-weight:800;
    margin:0 0 30px;letter-spacing:-.01em;
  }
  .opts{display:flex;flex-direction:column;gap:11px;}
  .opt{
    width:100%;text-align:left;cursor:pointer;
    background:var(--card);border:1px solid var(--line);
    border-radius:15px;padding:17px 18px;
    color:var(--ink);font-size:14.5px;line-height:1.55;
    font-family:inherit;position:relative;
    transition:border-color .2s, background .2s, transform .12s;
    display:flex;gap:13px;align-items:flex-start;
  }
  .opt .idx{
    flex:0 0 auto;width:20px;height:20px;border-radius:6px;
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:10px;color:var(--muted);margin-top:1px;font-weight:700;
  }
  .opt:hover{border-color:rgba(255,107,53,.55);background:rgba(255,107,53,.06);}
  .opt:active{transform:scale(.99);}
  .opt.sel{border-color:var(--orange);background:rgba(255,107,53,.14);}
  .opt.sel .idx{border-color:var(--orange);color:var(--orange);}

  /* ---------- result ---------- */
  .result{padding-top:7vh;}
  .rmatch{font-size:12px;letter-spacing:.22em;color:var(--cyan);font-weight:700;margin-bottom:12px;}
  .rcity{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:clamp(56px,17vw,80px);font-weight:900;line-height:.95;
    margin:0 0 6px;letter-spacing:.04em;
    background:linear-gradient(120deg,#fff 10%,var(--orange) 60%,#ffd166);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .ren{font-size:11px;letter-spacing:.42em;color:var(--muted);margin-bottom:22px;}
  .rtag{
    display:inline-block;font-size:12px;font-weight:700;
    padding:6px 12px;border-radius:100px;margin-bottom:26px;
    background:rgba(78,205,196,.12);color:var(--cyan);
    border:1px solid rgba(78,205,196,.25);
  }
  .quote{
    font-family:"Songti SC","Noto Serif SC",serif;
    font-size:22px;line-height:1.55;font-weight:700;
    margin:0 0 24px;padding-left:18px;
    border-left:3px solid var(--orange);
  }
  .read{font-size:14.5px;line-height:1.9;color:rgba(245,242,236,.78);margin:0 0 30px;}

  .panel{
    background:var(--card);border:1px solid var(--line);
    border-radius:18px;padding:20px;margin-bottom:16px;
  }
  .ptitle{
    font-size:11px;letter-spacing:.24em;color:var(--muted);
    font-weight:700;margin-bottom:16px;text-transform:uppercase;
  }
  .radar{display:flex;justify-content:center;padding:4px 0 2px;}
  .signals{display:flex;flex-direction:column;gap:12px;}
  .sig{display:flex;gap:11px;font-size:13.5px;line-height:1.65;color:rgba(245,242,236,.8);}
  .sig i{flex:0 0 auto;width:5px;height:5px;border-radius:50%;background:var(--orange);margin-top:9px;}

  .facts{display:flex;flex-direction:column;gap:11px;}
  .fact{font-size:13.5px;line-height:1.6;color:rgba(245,242,236,.78);padding-left:14px;position:relative;}
  .fact::before{content:"";position:absolute;left:0;top:8px;width:6px;height:1px;background:var(--cyan);}

  .warn{
    font-size:13px;line-height:1.75;color:#ffb38a;
    background:rgba(255,107,53,.07);
    border:1px solid rgba(255,107,53,.2);
    border-radius:14px;padding:15px 17px;margin-bottom:16px;
  }

  .alts{display:flex;gap:10px;}
  .alt{
    flex:1;background:var(--card);border:1px solid var(--line);
    border-radius:14px;padding:14px;text-align:center;
  }
  .alt b{display:block;font-size:16px;margin-bottom:4px;font-family:"Songti SC",serif;}
  .alt span{font-size:11px;color:var(--muted);}

  .pay{
    margin-top:26px;padding:22px;
    border-radius:18px;
    background:linear-gradient(150deg,rgba(255,107,53,.13),rgba(78,205,196,.07));
    border:1px solid rgba(255,107,53,.25);
  }
  .pay h3{margin:0 0 8px;font-size:17px;font-family:"Songti SC",serif;}
  .pay p{margin:0 0 16px;font-size:12.5px;line-height:1.7;color:var(--muted);}
  .pay small{display:block;margin-top:12px;font-size:11px;color:rgba(245,242,236,.4);line-height:1.6;}

  .foot{
    margin-top:34px;font-size:11px;color:rgba(245,242,236,.32);
    line-height:1.8;text-align:center;
  }

  .toast{
    position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#0a0a0f;font-size:13px;font-weight:700;
    padding:12px 20px;border-radius:100px;opacity:0;transition:.3s;z-index:99;
    pointer-events:none;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 双极倾向条 */
  .dims{display:flex;flex-direction:column;gap:20px;}
  .dimhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px;}
  .dimhead .lbl{font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:700;}
  .dimhead .val{font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700;}
  .dimhead .val i{font-style:normal;font-size:12px;color:var(--muted);margin-left:5px;font-weight:400;}
  .dimtrack{height:6px;border-radius:6px;background:rgba(255,255,255,.07);overflow:hidden;}
  .dimtrack i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--orange),#ffd166);width:0;transition:width 1s cubic-bezier(.22,.8,.3,1);}
  .dimtrack.dual{display:flex;gap:2px;background:transparent;overflow:visible;}
  .dimtrack.dual i{border-radius:0;}
  .dimtrack.dual .low{background:rgba(78,205,196,.5);border-radius:6px 0 0 6px;}
  .dimtrack.dual .high{background:linear-gradient(90deg,var(--orange),#ffd166);border-radius:0 6px 6px 0;}
  .dimfoot{display:flex;justify-content:space-between;margin-top:7px;font-size:11px;color:rgba(245,242,236,.4);letter-spacing:.04em;}
  .dimfoot b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums;}

  /* 题目过渡 */
  .qanim{animation:qIn .34s cubic-bezier(.22,.8,.3,1) both;}
  @keyframes qIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}

  /* 分享图弹窗 */
  .share-mask{position:fixed;inset:0;background:rgba(4,4,8,.93);z-index:200;display:none;align-items:center;justify-content:center;padding:20px;overflow-y:auto;}
  .share-mask.on{display:flex;}
  .share-box{width:100%;max-width:400px;text-align:center;margin:auto;}
  .share-box img{width:100%;border-radius:16px;box-shadow:0 24px 70px -24px rgba(0,0,0,.95);display:block;}
  .share-tip{font-size:12px;color:var(--muted);margin:16px 0 14px;line-height:1.7;}
  .share-close{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px 26px;font-size:13px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>
<div id="app">

  <!-- ============ 开场 ============ -->
  <section class="screen active intro" id="s-intro">
    <div class="kicker">CITY FATE TEST · 城市命定测试</div>
    <h1>你命里<br>该去<em>哪座城</em></h1>
    <p class="lede">
      不是问你喜不喜欢。<br>
      是测你<b>骨子里适合哪种生活密度</b>。<br>
      20 道题，4 分钟，出一座城。
    </p>
    <button class="btn" id="startBtn">开始测试 →</button>
    <div class="meta">
      <span>20 道题</span><span>约 4 分钟</span><span>9 座城</span>
    </div>
  </section>

  <!-- ============ 答题 ============ -->
  <section class="screen" id="s-quiz">
    <div class="topbar">
      <button class="back" id="backBtn" aria-label="上一题">←</button>
      <div class="bar"><i id="progress"></i></div>
      <div class="count" id="count">1 / 20</div>
    </div>
    <div class="qwrap">
      <div class="qnum" id="qnum">QUESTION 01</div>
      <h2 class="q" id="qtext"></h2>
      <div class="opts" id="opts"></div>
    </div>
  </section>

  <!-- ============ 结果 ============ -->
  <section class="screen result" id="s-result">
    <div class="rmatch" id="match">匹配度 <span id="matchNum">0</span>% · 9 座城里的第 1 名</div>
    <h2 class="rcity" id="city"></h2>
    <div class="ren" id="en"></div>
    <div class="rtag" id="tag"></div>

    <blockquote class="quote" id="quote"></blockquote>
    <p class="read" id="read"></p>

    <div class="panel">
      <div class="ptitle">你的城市坐标</div>
      <div class="radar" id="radar"></div>
    </div>

    <div class="panel">
      <div class="ptitle">四维倾向</div>
      <div class="dims" id="dims"></div>
    </div>

    <div class="panel">
      <div class="ptitle">你身上的三个信号</div>
      <div class="signals" id="signals"></div>
    </div>

    <div class="panel">
      <div class="ptitle">去了要知道的事</div>
      <div class="facts" id="facts"></div>
    </div>

    <div class="warn" id="warn"></div>

    <div class="ptitle" style="margin:26px 0 12px;">如果差一点，还有</div>
    <div class="alts" id="alts"></div>

    <div class="warn" style="margin-top:22px;">
      ※ 本测试为趣味自我探索工具，结果由固定算法生成，仅供娱乐参考，不构成任何专业建议。
    </div>

    <div style="display:flex;gap:10px;margin-top:26px;">
      <button class="btn" id="shareImgBtn" style="flex:1.5;">保存结果图</button>
      <button class="btn ghost" id="shareBtn" style="flex:1;">复制文案</button>
    </div>
    <button class="btn ghost" id="againBtn" style="margin-top:10px;">再测一次</button>

    <div class="foot">
      你命里该去哪座城 · 20 题版<br>
      点「开始测试」即可 · 手机电脑都能开<br>
      结果由四维评分计算，同一组答案结果稳定
    </div>
  </section>

</div>

<div class="toast" id="toast"></div>

<div class="share-mask" id="shareMask">
  <div class="share-box">
    <img id="shareImg" alt="结果图">
    <div class="share-tip" id="shareTip">长按图片保存 · 或直接截图</div>
    <button class="share-close" id="shareClose">关闭</button>
  </div>
</div>

<script>
/* =========================================================
   1. 题库
   维度：r 节奏(快↔慢)  a 野心(闯↔稳)  s 社交(密↔疏)  l 生活(享乐↔务实)
   每个选项给 0~25 的偏移，最终 50 + 累计，clamp 到 0~100
   ========================================================= */
const QUESTIONS = [
  {q:"周六早上九点，你被窗外吵醒。你最希望那是——",opts:[
    {t:"咖啡机的蒸汽声，和快递员在楼下喊你名字",d:{r:-8,l:14}},
    {t:"地铁施工的钻头声，提醒你这城市还在长",d:{r:16,a:14}},
    {t:"菜市场的吆喝，邻居阿姨问你吃没吃",d:{s:16,r:-8}},
    {t:"海浪，或者什么都没有",d:{r:-20,s:-8,l:10}}
  ]},
  {q:"选一座城市，你最先看的是——",opts:[
    {t:"工资条，和这个行业有多少岗位",d:{a:18,l:-8}},
    {t:"房租占收入的比例",d:{l:14,a:-6}},
    {t:"有没有能随时约出来的朋友",d:{s:18,a:-8}},
    {t:"天气，和有没有山或海",d:{l:8,r:-14,s:-4}}
  ]},
  {q:"周五晚上十点，你大概率在——",opts:[
    {t:"还在公司，而且你觉得这很正常",d:{r:18,a:18}},
    {t:"回家的地铁上，刷着明天去哪吃",d:{l:10,s:4}},
    {t:"饭局上，刚认识了三个人",d:{s:18,r:4}},
    {t:"在家，谁也不见，电量已耗尽",d:{s:-22,r:-8}}
  ]},
  {q:"关于「稳定」，你的真实想法是——",opts:[
    {t:"稳定是奢侈品，我先要可能性",d:{a:18,r:10}},
    {t:"稳定是底线，没有它我睡不着",d:{a:-14,l:10}},
    {t:"稳定可以，但不能无聊",d:{s:10,l:5}},
    {t:"稳定是给不敢走的人准备的",d:{a:14,r:-8}}
  ]},
  {q:"你理想中的通勤是——",opts:[
    {t:"20 分钟，骑车，路过早餐摊",d:{l:14,r:-14}},
    {t:"40 分钟地铁，能听完一集播客",d:{r:4,l:5}},
    {t:"走路 10 分钟，公司就在楼下",d:{r:-6,l:10}},
    {t:"无所谓，反正我加班到没通勤",d:{r:22,a:14}}
  ]},
  {q:"朋友说「这城市太卷了」，你的反应是——",opts:[
    {t:"卷才有机会啊",d:{a:18,r:14}},
    {t:"所以我准备走了",d:{a:-14,r:-18}},
    {t:"卷不卷的，先吃顿好的",d:{l:14,s:5}},
    {t:"我已经学会在卷里摸鱼了",d:{l:9,a:-5}}
  ]},
  {q:"手机里最舍不得删的那张照片是——",opts:[
    {t:"凌晨的写字楼，和你的工位",d:{a:14,r:14}},
    {t:"一顿很普通但很好吃的饭",d:{l:18}},
    {t:"一群人笑到模糊的合照",d:{s:18}},
    {t:"一片海，或者一座没人的山",d:{r:-18,s:-12}}
  ]},
  {q:"如果要在一座城市待十年，你最怕——",opts:[
    {t:"十年后我还是现在这个样子",d:{a:18}},
    {t:"我连个能借钱的朋友都没有",d:{s:18}},
    {t:"我每天都很累，但不知道为什么",d:{r:10,l:-10}},
    {t:"我看不到一棵树、一片水",d:{l:14,r:-14}}
  ]},
  {q:"你对「大城市」的想象是——",opts:[
    {t:"机会多，贵，快，值得",d:{a:14,r:18}},
    {t:"人多，贵，累，但回不去",d:{r:9,a:5}},
    {t:"热闹，方便，什么都能买到",d:{l:10,s:10}},
    {t:"跟我没关系，我想要小一点的地方",d:{r:-18,a:-14}}
  ]},
  {q:"周末有人临时约你，你——",opts:[
    {t:"立刻出门，在家待着难受",d:{s:18,r:9}},
    {t:"看是谁，熟的就出",d:{s:5}},
    {t:"说「下次一定」，然后继续躺着",d:{s:-14,l:10}},
    {t:"提议来我家，我做饭",d:{s:10,l:14}}
  ]},
  {q:"选工作时，你最不能忍的是——",opts:[
    {t:"没有成长，学不到东西",d:{a:18}},
    {t:"工资低，还画饼",d:{l:10,a:-5}},
    {t:"同事冷漠，一天说不上三句话",d:{s:18}},
    {t:"天天加班，没有生活",d:{l:14,r:-18}}
  ]},
  {q:"你心里的「好日子」是——",opts:[
    {t:"项目上线，数据漂亮，老板当众夸你",d:{a:18,r:9}},
    {t:"下班早，买点菜，慢慢做顿饭",d:{l:18,r:-14}},
    {t:"和朋友吃到凌晨，再走回家",d:{s:14,l:10}},
    {t:"一个人，安静，没人找你",d:{s:-18,l:5}}
  ]},
  {q:"你对买房这件事的态度是——",opts:[
    {t:"必须买，不然没有根",d:{a:9,l:5}},
    {t:"买不起就租，没什么大不了",d:{l:10,a:-5}},
    {t:"房价决定我去哪",d:{a:-9,l:10}},
    {t:"我根本不想被一套房子绑住",d:{a:-14,r:9}}
  ]},
  {q:"如果明天不用上班，你会——",opts:[
    {t:"睡到中午，然后找家店吃到下午",d:{l:18,r:-14}},
    {t:"去一个没去过的地方走走",d:{s:5,r:-4}},
    {t:"把一直想做的事推进一点",d:{a:14}},
    {t:"谁也别找我，我关机一天",d:{s:-18}}
  ]},
  {q:"你怎么看「离开北上广」——",opts:[
    {t:"是认输，我不认",d:{a:18,r:14}},
    {t:"是清醒，我在考虑",d:{a:-9,l:10}},
    {t:"是另一种开始，不是结束",d:{r:-14,l:9}},
    {t:"我本来就不在那儿",d:{r:-9}}
  ]},
  {q:"你更愿意住在——",opts:[

const state = { i:0, answers:new Array(QUESTIONS.length).fill(null) };

const DIM_NAMES = {r:"节奏", a:"野心", s:"社交", l:"生活"};

const $ = id => document.getElementById(id);
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));
function show(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));

}

  const t = $("toast");

function renderQuestion(){
  const q = QUESTIONS[state.i];
  $("qnum").textContent = "QUESTION " + String(state.i+1).padStart(2,"0");
  $("qtext").textContent = q.q;
  $("count").textContent = (state.i+1) + " / " + QUESTIONS.length;
  $("progress").style.width = ((state.i)/QUESTIONS.length*100) + "%";

  const box = $("opts");
  box.innerHTML = "";
  q.opts.forEach((o, idx)=>{
    const b = document.createElement("button");
    b.className = "opt" + (state.answers[state.i] === idx ? " sel" : "");
    b.innerHTML = '<span class="idx">' + "ABCD"[idx] + '</span><span>' + o.t + '</span>';
    b.onclick = ()=> pick(idx, b);
    box.appendChild(b);
  });

  // 每次换题，整块重新滑入
  const wrap = document.querySelector(".qwrap");
  wrap.classList.remove("qanim");
  void wrap.offsetWidth;
  wrap.classList.add("qanim");
}

function pick(idx, btn){
  state.answers[state.i] = idx;
  document.querySelectorAll(".opt").forEach(el=>el.classList.remove("sel"));
  btn.classList.add("sel");

  setTimeout(()=>{
    if(state.i < QUESTIONS.length - 1){
      state.i++;
      renderQuestion();
    }else{
      $("progress").style.width = "100%";
      finish();
    }
  }, 240);
}

function back(){
  if(state.i === 0){ show("s-intro"); return; }
  state.i--;
  renderQuestion();
}

/* =========================================================
   5. 计分与匹配
   ========================================================= */
/* 每题各维度的平均偏移：用于中心化，避免整份问卷往一个方向漂 */
const QMEAN = QUESTIONS.map(q=>{
  const m = {};
  DIMS.forEach(k=>{
    let s = 0;
    q.opts.forEach(o=>{
      const v = (o.d || {})[k];
      s += (typeof v === "number" ? v : 0);
    });
    m[k] = s / q.opts.length;
  });
  return m;
});

function computeScores(){
  const raw = {};
  DIMS.forEach(k=> raw[k] = 50);
  state.answers.forEach((ansIdx, qi)=>{
    if(ansIdx === null) return;
    const d = QUESTIONS[qi].opts[ansIdx].d || {};
    DIMS.forEach(k=>{
      const v = (typeof d[k] === "number") ? d[k] : 0;
      raw[k] += v - QMEAN[qi][k];
    });
  });
  const out = {};
  DIMS.forEach(k=>{
    const v = clamp(raw[k], 0, 100);
    out[k] = Math.round((5 + v * 0.9) * 10) / 10;   // 压在 5~95，避免出现 0/100 这种假峰值
  });
  return out;
}

function matchCities(scores){
  return CITIES.map(c=>{
    let sum = 0;
    DIMS.forEach(k=>{
      const diff = scores[k] - c.target[k];
      sum += diff * diff;
    });
    const dist = Math.sqrt(sum);            // 0 ~ 200
    const pct = clamp(Math.round((100 - dist * 0.52) * 10) / 10, 52, 98);
    return {city:c, pct, dist};
  }).sort((x,y)=> x.dist - y.dist);
}

/* =========================================================
   6. 雷达图
   ========================================================= */
function radarSVG(scores){
  const cx = 130, cy = 112, R = 76;
  const keys = DIMS;      // 上 右 下 左
  const angles = [-90, 0, 90, 180];
  const pt = (k, radius)=>{
    const ang = angles[k] * Math.PI / 180;
    return [cx + Math.cos(ang) * radius, cy + Math.sin(ang) * radius];
  };

  let grid = "";
  [0.25, 0.5, 0.75, 1].forEach(f=>{
    const p = keys.map((_,k)=> pt(k, R*f).join(",")).join(" ");
    grid += `<polygon points="${p}" fill="none" stroke="rgba(245,242,236,${f===1?0.16:0.07})" stroke-width="1"/>`;
  });
  const axes = keys.map((_,k)=>{
    const [x,y] = pt(k, R);
    return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="rgba(245,242,236,0.08)" stroke-width="1"/>`;
  }).join("");

  const valuePts = keys.map((key,k)=>{
    const v = scores[key] / 100;
    return pt(k, Math.max(R*0.12, R*v)).join(",");
  }).join(" ");

  const labels = keys.map((key,k)=>{
    const [x,y] = pt(k, R + 21);
    const anchor = k===1 ? "start" : k===3 ? "end" : "middle";
    const dy = k===0 ? -3 : k===2 ? 14 : 4;
    return `<text x="${x}" y="${y+dy}" fill="rgba(245,242,236,0.55)" font-size="10.5" text-anchor="${anchor}" font-family="sans-serif" letter-spacing="1">${DIM_NAMES[key]}</text>`;
  }).join("");

  return `<svg width="264" height="240" viewBox="0 0 264 240" style="display:block">
    ${grid}${axes}
    <polygon points="${valuePts}" fill="rgba(255,107,53,0.18)" stroke="#ff6b35" stroke-width="1.6" stroke-linejoin="round"/>
    ${keys.map((key,k)=>{
      const v = scores[key]/100;
      const [x,y] = pt(k, Math.max(R*0.12, R*v));
      return `<circle cx="${x}" cy="${y}" r="3" fill="#ff6b35"/>`;
    }).join("")}
    ${labels}
  </svg>`;
}

function signalsOf(scores){
  const list = [];
  const s = scores;
  if(s.r >= 70) list.push("你的节奏偏快。真的停下来，你会先觉得不安，然后才觉得舒服。");
  else if(s.r <= 34) list.push("你需要慢。持续的高强度不会让你更强，只会让你更空。");
  else list.push("你的节奏是中速。你能适应快，但不想被快定义。");

  if(s.a >= 70) list.push("你对「向上」有执念。哪怕嘴上说躺平，心里还是在算下一步。");
  else if(s.a <= 35) list.push("你更在意「过得舒服」，而不是「赢」。这不是不上进，是排序不同。");
  else list.push("你想进步，但不想用生活去换。典型的中场心态。");

  if(s.s >= 70) list.push("你需要人。独处太久，你会开始怀疑自己是不是不重要。");
  else if(s.s <= 35) list.push("你的社交电量有限。热闹是消耗，不是充电。");
  else list.push("你的社交是「够用就好」。有三五个能说真话的人，就够了。");

  else list.push("你能忍粗糙，只要目标足够清楚。但别忍太久。");

  return list.slice(0,3);
}

/* ---------- 双极倾向条 ---------- */
const DIM_PAIRS = {
  r: ["慢", "快"],
  a: ["稳", "闯"],
  s: ["独立", "需要人"],
  l: ["务实", "享乐"]
};

function renderBars(scores){
  const wrap = $("dims");
  wrap.innerHTML = DIMS.map(k=>{
    const pair = DIM_PAIRS[k];
    const high = scores[k];
    const low = 100 - high;
    const lead = high >= low ? pair[1] : pair[0];
    const leadPct = Math.max(high, low);
    return '<div class="dim">'
      + '<div class="dimhead"><span class="lbl">' + DIM_NAMES[k] + '</span>'
      + '<span class="val">' + leadPct.toFixed(1) + '%<i>' + lead + '</i></span></div>'
      + '<div class="dimtrack dual">'
      + '<i class="low" data-w="' + low + '"></i>'
      + '<i class="high" data-w="' + high + '"></i></div>'
      + '<div class="dimfoot"><span>' + pair[0] + ' <b>' + low.toFixed(1) + '%</b></span>'
      + '<span><b>' + high.toFixed(1) + '%</b> ' + pair[1] + '</span></div>'
      + '</div>';
  }).join("");

  requestAnimationFrame(()=>{
    wrap.querySelectorAll(".dimtrack i").forEach(el=>{
      el.style.width = el.dataset.w + "%";
    });
  });
}

/* ---------- 数字滚动 ---------- */
function animateNumber(target){
  const el = $("matchNum");
  const dur = 1000;
  const t0 = performance.now();
  function tick(now){
    const t = Math.min(1, (now - t0) / dur);
    const e = 1 - Math.pow(1 - t, 3);
    el.textContent = (target * e).toFixed(1);
    if(t < 1) requestAnimationFrame(tick);
    else el.textContent = target.toFixed(1);
  }
  requestAnimationFrame(tick);
}

/* ---------- 一致性提示 ---------- */
function consistencyHint(scores){
  const vals = DIMS.map(k=>scores[k]);
  const spread = Math.max(...vals) - Math.min(...vals);
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  if(spread < 16 && avg > 40 && avg < 62){
    return "你的答案比较中性——四个维度都落在中段，说明你可能还在探索期。把结果当成一个方向，不用当成结论。";
  }
  return null;
}

function finish(){
  const scores = computeScores();
  const ranked = matchCities(scores);
  const top = ranked[0];

  $("matchNum").textContent = "0";
  $("city").textContent = top.city.name;
  $("en").textContent = top.city.en;
  $("tag").textContent = top.city.tag;
  $("quote").textContent = top.city.quote;
  $("read").textContent = top.city.read;

  $("radar").innerHTML = radarSVG(scores);
  renderBars(scores);

  $("signals").innerHTML = signalsOf(scores)
    .map(t=>'<div class="sig"><i></i><span>'+t+'</span></div>').join("");

  $("facts").innerHTML = top.city.facts
    .map(t=>'<div class="fact">'+t+'</div>').join("");

  const hint = consistencyHint(scores);
  $("warn").innerHTML = (hint
      ? '<span style="display:block;margin-bottom:10px;color:#ffd9a8;font-weight:600;line-height:1.7">' + hint + '</span>'
      : '')
    + "※ " + top.city.warn;

  const alts = ranked.slice(1,3);
  $("alts").innerHTML = alts.map(a=>
    '<div class="alt"><b>'+a.city.name+'</b><span>'+a.pct+'% 匹配</span></div>'
  ).join("");

  show("s-result");
  animateNumber(top.pct);
  state.ranked = ranked;
  state.scores = scores;
}

/* ---------- 生成 9:16 结果图 ---------- */
function wrapLines(ctx, text, maxWidth){
  const out = [];
  let line = "";
  for(const ch of text){
    const test = line + ch;
    if(ctx.measureText(test).width > maxWidth && line){
      out.push(line);
      line = ch;
    }else{
      line = test;
    }
  }
  if(line) out.push(line);
  return out;
}

  const x = cv.getContext("2d");

  const serif = '"Songti SC","SimSun","Noto Serif SC",serif';
  const sans = '"PingFang SC","Microsoft YaHei",sans-serif';

  /* 背景 */
  x.fillStyle = "#0a0a10";
  x.fillRect(0, 0, W, H);

  let g = x.createRadialGradient(W*0.16, H*0.07, 0, W*0.16, H*0.07, W*0.95);
  g.addColorStop(0, "rgba(255,107,53,0.22)");
  g.addColorStop(1, "rgba(255,107,53,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  g = x.createRadialGradient(W*0.9, H*0.93, 0, W*0.9, H*0.93, W*0.95);
  g.addColorStop(0, "rgba(78,205,196,0.18)");
  g.addColorStop(1, "rgba(78,205,196,0)");
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  /* 顶部 */
  x.textAlign = "center";
  x.fillStyle = "rgba(245,242,236,.48)";
  x.font = "500 30px " + sans;
  x.fillText("你命里该去哪座城", W/2, 148);

  x.fillStyle = "#4ecdc4";
  x.font = "700 30px " + sans;
  x.fillText("匹配度 " + pct + "% · 9 座城里的第 1 名", W/2, 232);

  /* 城市名 */
  const grad = x.createLinearGradient(W*0.15, 0, W*0.85, 0);
  grad.addColorStop(0, "#ffffff");
  grad.addColorStop(0.55, "#ff6b35");
  grad.addColorStop(1, "#ffd166");
  x.fillStyle = grad;
  x.font = "900 188px " + serif;
  x.fillText(c.name, W/2, 452);

  x.fillStyle = "rgba(245,242,236,.42)";
  x.font = "500 30px " + sans;
  x.fillText(c.en, W/2, 522);

  /* 标签胶囊 */
  x.font = "700 34px " + sans;
  const tw = x.measureText(c.tag).width;
  const pw = tw + 76, ph = 76, px = (W-pw)/2, py = 590;
  x.beginPath();
  if(x.roundRect) x.roundRect(px, py, pw, ph, 38);
  else x.rect(px, py, pw, ph);
  x.fillStyle = "rgba(78,205,196,.12)";
  x.fill();
  x.strokeStyle = "rgba(78,205,196,.3)";
  x.lineWidth = 2;
  x.stroke();
  x.fillStyle = "#4ecdc4";
  x.fillText(c.tag, W/2, py + 50);

  /* 金句：自动挑一个能一行放下的字号，实在放不下再折行 */
  x.textAlign = "left";
  x.fillStyle = "#f5f2ec";
  let qSize = 58;
  while(qSize > 40){
    x.font = "700 " + qSize + "px " + serif;
    if(x.measureText(c.quote).width <= 850) break;
    qSize -= 2;
  }
  const qLines = wrapLines(x, c.quote, 850);
  let qy = 782;
  const qTop = qy - qSize;
  const qStep = qSize + 24;
  qLines.forEach(line=>{
    x.fillText(line, 116, qy);
    qy += qStep;
  });
  x.fillStyle = "#ff6b35";
  x.fillRect(72, qTop, 6, qy - qStep - qTop + 10);

  /* 解读 */
  x.fillStyle = "rgba(245,242,236,.7)";
  x.font = "400 35px " + sans;
  const read = c.read.length > 68 ? c.read.slice(0, 68) + "……" : c.read;
  const rLines = wrapLines(x, read, 880);
  let ry = qy + 40;
  rLines.slice(0, 3).forEach(line=>{
    x.fillText(line, 96, ry);
    ry += 56;
  });

  /* 四维条 */
  const vals = state.scores;
  const barTop = ry + 40;
  DIMS.forEach((k, i)=>{
    const y = barTop + i * 80;
    const v = vals[k];
    const bx = 96, bw = 888, bh = 8;

    x.textAlign = "left";
    x.fillStyle = "rgba(245,242,236,.45)";
    x.font = "500 24px " + sans;
    x.fillText(DIM_NAMES[k], bx, y - 15);

    x.textAlign = "right";
    x.fillStyle = "rgba(245,242,236,.55)";
    const leadWord = v >= 50 ? DIM_PAIRS[k][1] : DIM_PAIRS[k][0];
    const leadPct = Math.max(v, 100 - v);
    x.fillText(leadPct.toFixed(1) + "% " + leadWord, bx + bw, y - 15);

    x.fillStyle = "rgba(255,255,255,.07)";
    x.fillRect(bx, y, bw, bh);

    const lowW = bw * (100 - v) / 100;
    x.fillStyle = "rgba(78,205,196,.55)";
    x.fillRect(bx, y, lowW, bh);

    x.fillStyle = "#ff6b35";
    x.fillRect(bx + lowW, y, bw - lowW, bh);
  });

  /* 底部 */
  const footY = 1640;
  x.strokeStyle = "rgba(245,242,236,.12)";
  x.lineWidth = 1;
  x.beginPath(); x.moveTo(110, footY); x.lineTo(W-110, footY); x.stroke();

  x.textAlign = "center";
  x.fillStyle = "rgba(245,242,236,.36)";
  x.font = "500 28px " + sans;
  x.fillText("20 道题 · 4 分钟 · 9 座城市", W/2, footY + 66);

  x.fillStyle = "rgba(245,242,236,.6)";
  x.font = "600 30px " + sans;
  x.fillText("测测你适合定居哪座城市", W/2, footY + 126);

  state.shareData = cv.toDataURL("image/png");
  $("shareImg").src = state.shareData;
  $("shareMask").classList.add("on");
}

async function copyShare(){
  const text = shareText();
  try{
    await navigator.clipboard.writeText(text);
    toast("已复制，去小红书/朋友圈发吧");
  }catch(e){
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); toast("已复制"); }
    catch(err){ toast("复制失败，请手动选择"); }
    document.body.removeChild(ta);
  }
}

/* =========================================================
   9. 事件绑定
   ========================================================= */
$("startBtn").onclick = ()=>{
  state.i = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
  show("s-quiz");
};
$("backBtn").onclick = back;
$("againBtn").onclick = ()=>{
  state.i = 0;
  state.answers = new Array(QUESTIONS.length).fill(null);
  show("s-intro");
};
$("shareBtn").onclick = copyShare;
$("shareImgBtn").onclick = makeShareImage;
$("shareClose").onclick = ()=>{ $("shareMask").classList.remove("on"); };
$("shareMask").onclick = (e)=>{ if(e.target === $("shareMask")) $("shareMask").classList.remove("on"); };
</script>
